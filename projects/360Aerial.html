<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maison M2 — 360° View</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #1a1a1a;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── VIEWER ── */
    #spin-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #spin-container.dragging { cursor: grabbing; }

    #spin-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      will-change: contents;
    }

  </style>
</head>
<body>

  <!-- VIEWER -->
  <div id="spin-container">
    <img id="spin-img" src="" alt="Maison M2 360° view" draggable="false" />
  </div>

  <script>
    // ─────────────────────────────────────────────
    // CONFIGURATION — edit these to match your setup
    // ─────────────────────────────────────────────
    const CONFIG = {
      // Base URL — update to your S3/CDN path once uploaded
      // Sequence4 frames are stored in this subfolder next to this HTML file
      baseUrl: './360/',

      // Total number of frames
      totalFrames: 60,

      // Filename pattern — {index} replaced with the one-based frame number
      // Matches: Sequence_1.png, Sequence_2.png ... Sequence_60.png
      filePattern: 'Sequence_{index}.png',

      // 2-digit zero-padding: 00, 01 ...
      padDigits: 1,

      // Pixels of horizontal drag needed to advance one frame
      dragSensitivity: 6,
    };
    // ─────────────────────────────────────────────

    let currentFrame = 0;
    const images = [];
    const loadQueue = [];
    let activeLoads = 0;
    const maxConcurrentLoads = 3;
    let isReady = false;

    // Drag state
    let isDragging = false;
    let dragStartX = 0;
    let dragAccum = 0;    // accumulated pixels since last frame step

    const spinImg      = document.getElementById('spin-img');
    const container    = document.getElementById('spin-container');
    // ── Helpers ──────────────────────────────────

    function frameSrc(index) {
      const padded = String(index + 1).padStart(CONFIG.padDigits, '0');
      return CONFIG.baseUrl + CONFIG.filePattern.replace('{index}', padded);
    }

    function processLoadQueue() {
      while (activeLoads < maxConcurrentLoads && loadQueue.length > 0) {
        const index = loadQueue.shift();
        const image = images[index];
        activeLoads++;
        image.onload = image.onerror = () => {
          activeLoads--;
          if (index === 0) isReady = true;
          if (index === currentFrame && image.naturalWidth > 0) {
            spinImg.src = image.src;
          }
          processLoadQueue();
        };
        image.src = frameSrc(index);
      }
    }

    function requestFrame(index, prioritize = false) {
      index = ((index % CONFIG.totalFrames) + CONFIG.totalFrames) % CONFIG.totalFrames;
      if (images[index]) {
        if (prioritize) {
          const queuedIndex = loadQueue.indexOf(index);
          if (queuedIndex > 0) {
            loadQueue.splice(queuedIndex, 1);
            loadQueue.unshift(index);
          }
        }
        processLoadQueue();
        return;
      }

      images[index] = new Image();
      if (prioritize) {
        loadQueue.unshift(index);
      } else {
        loadQueue.push(index);
      }
      processLoadQueue();
    }

    function showFrame(index) {
      currentFrame = ((index % CONFIG.totalFrames) + CONFIG.totalFrames) % CONFIG.totalFrames;
      const image = images[currentFrame];
      if (image && image.complete && image.naturalWidth > 0) {
        spinImg.src = image.src;
      } else {
        requestFrame(currentFrame, true);
      }
      requestFrame(currentFrame + 1);
      requestFrame(currentFrame - 1);
    }

    // ── Drag — Mouse ─────────────────────────────

    container.addEventListener('pointerdown', (e) => {
      if (!isReady) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragAccum = 0;
      container.classList.add('dragging');
      container.setPointerCapture(e.pointerId);
    });

    container.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      dragStartX = e.clientX;
      dragAccum += dx;

      const steps = Math.trunc(dragAccum / CONFIG.dragSensitivity);
      if (steps !== 0) {
        showFrame(currentFrame - steps);
        dragAccum -= steps * CONFIG.dragSensitivity;
      }
    });

    container.addEventListener('pointerup', () => {
      isDragging = false;
      container.classList.remove('dragging');
    });

    container.addEventListener('pointercancel', () => {
      isDragging = false;
      container.classList.remove('dragging');
    });

    // ── Keyboard ─────────────────────────────────

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  showFrame(currentFrame - 1);
      if (e.key === 'ArrowRight') showFrame(currentFrame + 1);
    });

    // ── Start ────────────────────────────────────

    showFrame(0);
  </script>
</body>
</html>
